[project]
name = "stub-mcp-server"
version = "1.0.0"
description = "A stub MCP server with weather, calendar, and price checking functions"
authors = [{name = "Testing Ground"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "mcp>=0.9.0"
]

[project.scripts]
stub-mcp-server = "server:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
